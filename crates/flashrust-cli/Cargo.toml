[package]
name = "flashrust-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "flashrust"
path = "src/main.rs"

[dependencies]
toolkit-core = { path = "../toolkit-core" }
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
